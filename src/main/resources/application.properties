# Identity of this inhabitant. Override per process: -Davatar.name=alice -Davatar.additionalContext="..."
avatar.name=bob
quarkus.http.port=8080

# --- OpenAI -----------------------------------------------------------------------------------
# No key in this file: export OPENAI_API_KEY (or set the two QUARKUS_LANGCHAIN4J_OPENAI_*_API_KEY variables).
# The chat, reflection, bleep and image bots use the named config "vanillaopenai";
# the embedding model uses the default (unnamed) one. Both need the key.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
quarkus.langchain4j.openai.vanillaopenai.api-key=${OPENAI_API_KEY:}

quarkus.langchain4j.vanillaopenai.chat-model.provider=openai
quarkus.langchain4j.openai.vanillaopenai.timeout=60s
quarkus.langchain4j.openai.vanillaopenai.chat-model.max-tokens=380
quarkus.langchain4j.openai.vanillaopenai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.vanillaopenai.image-model.enabled=true
# gpt-image-1 is no longer served by OpenAI (checked 2026-11-15). gpt-image-1.5 also works: nicer, slower, dearer.
quarkus.langchain4j.openai.vanillaopenai.image-model.model-name=gpt-image-1-mini
#quarkus.langchain4j.openai.log-responses=true
#quarkus.langchain4j.openai.log-requests=true

# --- Long-term memory (pgvector) --------------------------------------------------------------
quarkus.datasource.devservices.image-name=ankane/pgvector:v0.5.1
# Explicit because langchain4j-embeddings-all-minilm-l6-v2-q is also on the classpath.
quarkus.langchain4j.embedding-model.provider=openai
# Dimension of the OpenAI embeddings. Changing the embedding model means changing it and dropping the table.
quarkus.langchain4j.pgvector.dimension=1536

# --- Container image --------------------------------------------------------------------------
# A plain `mvn package` also builds the Jib image; add -Dquarkus.container-image.build=false to skip it.
quarkus.container-image.build=true
quarkus.container-image.group=sebi2706
quarkus.container-image.tag=1.1

# --- Kafka ------------------------------------------------------------------------------------
# Allow larger Kafka messages on the bleeps channel (base64 image payloads can be several MB)
quarkus.kafka.devservices.enabled=true
mp.messaging.outgoing.bleeps.connector=smallrye-kafka
mp.messaging.outgoing.bleeps.max.request.size=10485760
# Matching consumer-side limit
mp.messaging.outgoing.bleeps.max.partition.fetch.bytes=10485760

# Broker-side: raise the message size limit on the Dev Services Kafka broker.
# Default provider is upstream Apache Kafka, configured via KAFKA_* env vars.
quarkus.kafka.devservices.container-env.KAFKA_MESSAGE_MAX_BYTES=10485760
quarkus.kafka.devservices.container-env.KAFKA_REPLICA_FETCH_MAX_BYTES=10485760
quarkus.kafka.devservices.container-env.KAFKA_SOCKET_REQUEST_MAX_BYTES=10485760
